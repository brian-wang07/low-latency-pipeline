# ITCH replay with the NullRouter: the pipeline latency benchmark and the harness for
# strategies, risk and the rate model. Paths are relative to build/, where the
# manager runs. Run: ./manager ../configs/itch-null.cfg

mode=itch
feed_path=../itch_feed/S071321-v50.txt
symbols=NVDA
# 0 replays the whole feed; benchmarks use 20M events.
max_events=20_000_000
dashboard=1

strategy=builtin:dummy
exec.mode=null
exec.clock=event
exec.timer_ms=10
exec.stats_log=strategy_stats.log
auto_restart_exec=0

# cores.exchange / cores.core / cores.exec / cores.snapshot / cores.lat_dump
# default to src/common/config.hpp.

# Risk: lots and quote-currency units; 0 disables a check.
risk.allowed_assets=NVDA,TQQQ
risk.max_order_qty=1000
risk.max_order_notional=250000
risk.max_position=1000
risk.max_position_notional=500000
risk.max_open_orders=100
risk.price_band_bp=500
risk.spot_only=1

# Kraken Starter rate counter, run on event time so replay sees live-like limits.
rate.model=kraken
kraken.rate_max=60
kraken.rate_decay=1
kraken.max_open_per_pair=60
rate.margin=5

# Null-mode starting balances (asset units).
null.balance.USD=1000000
null.balance.NVDA=10000
null.balance.TQQQ=10000
