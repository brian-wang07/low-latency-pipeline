# Benchmark run for benchmarks/benchmarks.md: 20M feed events, NVDA, the logging
# strategy (no orders), dashboard on as in earlier entries. From build/:
#   cat ../itch_feed/S071321-v50.txt > /dev/null && ./manager ../configs/bench.cfg
# core_main writes build/latency.log (LAT_LOG= overrides). Exit code 0 at the cap.

mode=itch
feed_path=../itch_feed/S071321-v50.txt
symbols=NVDA
max_events=20_000_000
dashboard=1

strategy=builtin:logging
exec.mode=null
exec.stats_log=strategy_stats.log
risk.allowed_assets=NVDA
